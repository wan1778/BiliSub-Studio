name: Refresh CSharp code map

on:
  push:
    branches:
      - editor-all-in-one
    paths:
      - ".github/workflows/refresh-csharp-code-map.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: editor-all-in-one
          fetch-depth: 1
      - name: Generate exact CSharp code map
        run: python csharp/scripts/generate_csharp_code_map.py
      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/CSHARP_CODE_MAP.generated.md
          if git diff --cached --quiet; then
            echo "Code map already current."
            exit 0
          fi
          git commit -m "docs: refresh generated CSharp code map"
          git push origin HEAD:editor-all-in-one
