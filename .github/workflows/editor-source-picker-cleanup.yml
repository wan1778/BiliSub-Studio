name: Editor SOURCE / FILE PICKER cleanup

on:
  push:
    branches:
      - editor-source-file-picker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-source-file-picker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply SOURCE-01 through SOURCE-06
        run: python csharp/scripts/editor_source_picker_cleanup.py
      - name: Refresh generated CSharp code map
        run: python csharp/scripts/generate_csharp_code_map.py
      - name: Validate static migration contracts
        run: python csharp/scripts/validate_csharp_migration.py
      - name: Commit SOURCE cleanup
        run: |
          if git diff --quiet; then
            echo "No SOURCE cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml \
                  csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml.cs \
                  csharp/src/BiliSubStudio.App/Services/FilePickerService.cs \
                  csharp/src/BiliSubStudio.Core/Editor/EditorSourceSelection.cs \
                  csharp/tests/BiliSubStudio.Core.ContractTests/EditorSourceSelectionContract.cs \
                  csharp/tests/BiliSubStudio.Core.ContractTests/Program.cs \
                  csharp/scripts/validate_csharp_migration.py \
                  docs/migration/CSHARP_CODE_MAP.generated.md
          git commit -m "editor: complete SOURCE-01 through SOURCE-06"
          git push origin HEAD:editor-source-file-picker
