name: Refresh Editor parity CSharp code map

on:
  push:
    branches:
      - editor-live-parity-fix
    paths:
      - "csharp/**"
      - ".github/workflows/refresh-editor-parity-code-map.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-live-parity-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate code map
        run: python csharp/scripts/generate_csharp_code_map.py
      - name: Commit generated map
        run: |
          if git diff --quiet -- docs/migration/CSHARP_CODE_MAP.generated.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration/CSHARP_CODE_MAP.generated.md
          git commit -m "docs: refresh generated CSharp code map for Editor parity"
          git push origin HEAD:editor-live-parity-fix
