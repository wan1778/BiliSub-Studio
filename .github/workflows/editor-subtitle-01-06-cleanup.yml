name: Editor SUB-01 through SUB-06 cleanup

on:
  push:
    branches:
      - editor-srt-subtitle-01-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-srt-subtitle-01-06
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply SUB cleanup
        run: python csharp/scripts/editor_subtitle_01_06_cleanup.py
      - name: Regenerate C# code map
        run: python csharp/scripts/generate_csharp_code_map.py
      - name: Validate static migration contracts
        run: python csharp/scripts/validate_csharp_migration.py
      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml \
                  csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml.cs \
                  csharp/src/BiliSubStudio.App/Pages/EditorPage.SubtitleCueEditing.cs \
                  csharp/scripts/validate_csharp_migration.py \
                  csharp/tests/BiliSubStudio.Core.ContractTests/Program.cs \
                  docs/migration/CSHARP_CODE_MAP.generated.md
          git commit -m "editor: complete SUB-01 through SUB-06"
          git push origin HEAD:editor-srt-subtitle-01-06
