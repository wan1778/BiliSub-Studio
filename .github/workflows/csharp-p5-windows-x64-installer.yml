name: Fix beta.33 preview contract

on:
  pull_request:
    paths:
      - ".github/workflows/csharp-p5-windows-x64-installer.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update processed-preview reflection call for optional voice track
        env:
          TARGET_BRANCH: editor-all-in-one
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $env:TARGET_BRANCH --depth=100
          git checkout -B fix-preview-contract "origin/$env:TARGET_BRANCH"
          $path = "csharp/tests/BiliSubStudio.Core.ContractTests/Program.cs"
          $text = [IO.File]::ReadAllText($path)
          $old = '["input.mp4", "preview.mp4", graph, sliced.Audio, 100d, 12d])!);'
          $new = '["input.mp4", "preview.mp4", graph, sliced.Audio, 100d, 12d, null])!);'
          if (-not $text.Contains($old, [StringComparison]::Ordinal)) { throw "Expected preview reflection invocation not found" }
          $text = $text.Replace($old, $new, [StringComparison]::Ordinal)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
          git add $path
          git commit -m "test: pass optional voice track to preview contract"
          git push origin HEAD:$env:TARGET_BRANCH
