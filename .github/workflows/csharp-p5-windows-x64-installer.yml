name: C# P5 Windows x64 installer candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/csharp-p5-windows-x64-installer.yml"
      - "global.json"
      - "csharp/**"
      - "internal/ocr/worker.py"
      - "internal/asr/**"
      - "internal/tts/**"
      - "internal/translation/**"
      - "docs/migration/**"
      - "docs/engineering/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/csharp-p5-windows-x64-installer.yml"
      - "global.json"
      - "csharp/**"
      - "internal/ocr/worker.py"
      - "internal/asr/**"
      - "internal/tts/**"
      - "internal/translation/**"
      - "docs/migration/**"
      - "docs/engineering/**"

permissions:
  contents: write

concurrency:
  group: csharp-p5-windows-x64-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    name: Compile, test, publish and package
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
      NUGET_XMLDOC_MODE: skip
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bootstrap exact beta.33 tree
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: editor-all-in-one
          BASE_SHA: b5c78223c5d5835199bb2ed6be09301fabe379d8
          PATCH_SHA256: a11bfed8108c4bc9441095ab468dbab0c00a37eda93bccf18f59271bbcad4b0b
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $env:TARGET_BRANCH --depth=100
          $current = (git rev-parse "origin/$env:TARGET_BRANCH").Trim()
          if (-not $current) { throw "Cannot resolve current branch head" }

          $encoded = ""
          foreach ($index in 0..5) {
            $name = "part-{0:D2}" -f $index
            $piece = (git show "$current`:.beta33-bootstrap/$name")
            if (-not $piece) { throw "Missing bootstrap patch chunk $name" }
            $encoded += ($piece -join "").Trim()
          }
          $b64 = Join-Path $env:RUNNER_TEMP "beta33.patch.xz.b64"
          $xz = Join-Path $env:RUNNER_TEMP "beta33.patch.xz"
          $patch = Join-Path $env:RUNNER_TEMP "beta33.patch"
          [IO.File]::WriteAllText($b64, $encoded, [Text.Encoding]::ASCII)
          @'
import base64, hashlib, lzma, os, pathlib
b64 = pathlib.Path(os.environ["BETA33_B64"])
xz = pathlib.Path(os.environ["BETA33_XZ"])
patch = pathlib.Path(os.environ["BETA33_PATCH"])
raw = base64.b64decode(b64.read_bytes(), validate=True)
actual = hashlib.sha256(raw).hexdigest()
expected = os.environ["PATCH_SHA256"].lower()
if actual != expected:
    raise SystemExit(f"bootstrap patch SHA mismatch: {actual} != {expected}")
xz.write_bytes(raw)
patch.write_bytes(lzma.decompress(raw))
'@ | Set-Content (Join-Path $env:RUNNER_TEMP "decode_beta33.py") -Encoding utf8
          $env:BETA33_B64 = $b64
          $env:BETA33_XZ = $xz
          $env:BETA33_PATCH = $patch
          python (Join-Path $env:RUNNER_TEMP "decode_beta33.py")

          git cat-file -e "$env:BASE_SHA`^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Baseline commit is unavailable" }
          git reset --hard $env:BASE_SHA
          git clean -fdx
          git apply --whitespace=nowarn $patch

          python -m py_compile internal/asr/worker.py internal/tts/worker.py
          python csharp/scripts/generate_csharp_code_map.py --check
          python csharp/scripts/validate_csharp_migration.py
          if ($LASTEXITCODE -ne 0) { throw "beta.33 static contract failed" }

          git add -A
          $tree = (git write-tree).Trim()
          if (-not $tree) { throw "Could not write target tree" }
          $commit = ("editor: implement Whisper timing and local NghiTTS" | git commit-tree $tree -p $current).Trim()
          if (-not $commit) { throw "Could not create target commit" }
          git push origin "$commit`:refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "Could not fast-forward target branch" }
          Write-Host "BETA33_TARGET_COMMIT=$commit"

      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Install verified Inno Setup 7 compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" -OutFile $download
          gh release verify-asset is-7_0_2 $download --repo jrsoftware/issrc
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup release attestation failed" }
          $signature = Get-AuthenticodeSignature $download
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Inno Setup Authenticode signature is not the reviewed publisher"
          }
          $process = Start-Process $download -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc -PathType Leaf)) { throw "ISCC.exe not found after verified install" }
          "INNO_SETUP_ISCC=$iscc" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify long-media bundle contracts
        run: python csharp/scripts/verify_media_bundle_contract.py

      - name: Verify local translation model and skill contracts
        run: python csharp/scripts/verify_translation_skill_contract.py

      - name: Verify raw Bilibili CDN endpoint discovery
        run: dotnet run --project csharp/tests/BiliSubStudio.CdnRegression/BiliSubStudio.CdnRegression.csproj -c Release -p:NuGetAudit=false

      - name: Verify Bilibili subtitle priority and AI fallback
        run: dotnet run --project csharp/tests/BiliSubStudio.SubtitleRegression/BiliSubStudio.SubtitleRegression.csproj -c Release -p:NuGetAudit=false

      - name: Verify CDN failover keeps exact Range offset
        run: dotnet run --project csharp/tests/BiliSubStudio.CdnFailoverRegression/BiliSubStudio.CdnFailoverRegression.csproj -c Release -p:NuGetAudit=false

      - name: Verify root-launcher and tidy installer layout
        run: python csharp/scripts/verify_installer_runtime_layout_contract.py

      - name: Verify Windows WinUI build
        id: verify
        run: ./csharp/scripts/verify.ps1

      - name: Package verified beta build
        id: package
        run: ./csharp/scripts/package_windows_candidate.ps1

      - name: Upload build and evidence
        uses: actions/upload-artifact@v4
        with:
          name: BiliSubStudio-CSharp-P5-Installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: csharp/artifacts/windows-x64/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish public beta and beta update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactDir = (Resolve-Path "csharp/artifacts/windows-x64").Path
          $identity = Get-Content (Join-Path $artifactDir "BUILD_IDENTITY.json") -Raw | ConvertFrom-Json
          $version = ([string]$identity.informational_version).Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^4\.0\.0-beta\.(\d+)-csharp-p5$') {
            throw "unexpected public beta informational version: $version"
          }

          $beta = [int]$Matches[1]
          if ($beta -lt 15) { throw "short public release naming requires beta 15 or newer" }
          $publicVersion = "4.0.$($beta - 14)"
          $tag = "v$publicVersion"

          # The technical build identity stays inside evidence/metadata. GitHub Releases,
          # filenames and the UI-facing version use short semantic versions only.
          $existingManifest = Get-Content "update/beta.json" -Raw | ConvertFrom-Json
          $publicUrlMarker = "/releases/download/$tag/"
          if ($existingManifest.channel_ready -eq $true -and
              [string]$existingManifest.version -eq $version -and
              ([string]$existingManifest.download_url).Contains($publicUrlMarker, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Host "Public release $publicVersion for technical build $version is already published."
            exit 0
          }

          $publishDir = (Resolve-Path "csharp/src/BiliSubStudio.App/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/publish").Path
          $installerStatus = Get-Content (Join-Path $artifactDir "INSTALLER_GATE_STATUS.json") -Raw | ConvertFrom-Json
          if (-not $installerStatus.public_beta_ready -or -not $installerStatus.root_launcher_smoke -or -not $installerStatus.installer_install_smoke) {
            throw "installer evidence is not public-beta ready"
          }

          $verifiedInstaller = Join-Path $artifactDir ([string]$installerStatus.primary_user_artifact)
          if (-not (Test-Path $verifiedInstaller -PathType Leaf)) { throw "verified installer is missing" }
          $installerName = "BiliSubStudio_Setup_v${publicVersion}_x64.exe"
          $installer = Join-Path $artifactDir $installerName
          Copy-Item $verifiedInstaller $installer -Force

          $portableName = "BiliSubStudio_${publicVersion}_Windows-x64-portable.zip"
          $portable = Join-Path $artifactDir $portableName
          if (Test-Path $portable) { Remove-Item $portable -Force }
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $portable -CompressionLevel Optimal
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableSize = (Get-Item $portable).Length

          $technicalSources = @(Get-ChildItem $artifactDir -File -Filter "BiliSubStudio_v$version-source-*.zip")
          if ($technicalSources.Count -ne 1) { throw "expected exactly one exact-source archive for $version, found $($technicalSources.Count)" }
          $technicalSource = $technicalSources[0]
          $sourceTag = "source"
          if ($technicalSource.Name -match 'source-([0-9a-fA-F]{12})\.zip$') { $sourceTag = $Matches[1].ToLowerInvariant() }
          $sourceName = "BiliSubStudio_v${publicVersion}-source-${sourceTag}.zip"
          $source = Join-Path $artifactDir $sourceName
          Copy-Item $technicalSource.FullName $source -Force

          $releaseSums = Join-Path $artifactDir "RELEASE_SHA256SUMS.txt"
          @(
            "$((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant())  $installerName",
            "$portableHash  $portableName",
            "$((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant())  $sourceName"
          ) | Set-Content $releaseSums -Encoding UTF8

          $notes = Join-Path $env:RUNNER_TEMP "bilisub-beta-release-notes.md"
          @(
            "# BiliSub Studio $publicVersion",
            "",
            '- OCR Auto dùng Predict → Probe → Commit: kiểm tra live RAM/VRAM trước từng bậc 1 → 2 → 4 → 8 → 16.',
            '- Mức N chỉ PASS khi đủ đúng N Python + N FFmpeg/OCR pipeline và throughput tăng ít nhất 10%.',
            '- Mức thiếu tài nguyên/không tăng tốc/lỗi/OOM/timeout tự quay về mức PASS gần nhất rồi mới quét.',
            '- Hủy OCR thu hồi toàn bộ Python và cây FFmpeg do lần quét sở hữu trước khi xóa checkpoint và trở về Quét từ đầu.'
          ) | Set-Content $notes -Encoding UTF8

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "release tag $tag already exists while update manifest is not ready; refusing to overwrite immutable public assets"
          }

          gh release create $tag $installer $portable $source $releaseSums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "BiliSub Studio $publicVersion" --notes-file $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "failed to create public release $publicVersion" }

          $downloadUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$tag/$portableName"
          $manifest = [ordered]@{
            # Keep the technical build identity here so beta-to-beta ordering remains exact.
            version = $version
            channel_ready = $true
            download_url = $downloadUrl
            sha256 = $portableHash
            size = $portableSize
            payload_kind = "winui3-portable-zip"
            notes = @(
              "OCR Auto kiểm tra live RAM/VRAM trước từng bậc 1 → 2 → 4 → 8 → 16.",
              "Mức N yêu cầu đủ N Python + N FFmpeg/OCR pipeline và gain throughput tối thiểu 10%.",
              "Mức không an toàn hoặc không còn tăng tốc tự quay về PASS gần nhất.",
              "Hủy OCR thu hồi sạch Python/FFmpeg rồi xóa checkpoint và trở về Quét từ đầu."
            )
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content "update/beta.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/beta.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release: publish $version as public $publicVersion update channel"
            if ($LASTEXITCODE -ne 0) { throw "failed to commit beta update manifest" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "failed to publish beta update manifest to main" }
          }

# Pull requests build and verify the exact installer without publishing it.
# Build identity remains technical for QA traceability; public GitHub release names are 4.0.1, 4.0.2, ...
