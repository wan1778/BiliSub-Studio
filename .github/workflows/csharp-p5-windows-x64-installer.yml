name: Apply M5 render validation checkpoint

on:
  pull_request:
    paths:
      - ".github/workflows/csharp-p5-windows-x64-installer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-all-in-one
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
      - name: Apply exact M5 source changes
        shell: pwsh
        run: |
          $encoded = ""
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\patch_m5.py", [Convert]::FromBase64String($encoded))
          python "$env:RUNNER_TEMP\patch_m5.py"
          python csharp/scripts/generate_csharp_code_map.py
          git diff --check
      - name: Compile and run Core contracts
        shell: pwsh
        run: dotnet run --project csharp/tests/BiliSubStudio.Core.ContractTests/BiliSubStudio.Core.ContractTests.csproj -c Release -p:NuGetAudit=false
      - name: Commit production checkpoint
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csharp/src/BiliSubStudio.Core/Editor/VideoEditorService.cs csharp/tests/BiliSubStudio.Core.ContractTests/Program.cs csharp/Directory.Build.props docs/migration/CSHARP_EDITOR_M5_CALL_MAP.md docs/migration/CSHARP_CODE_MAP.generated.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "M5 patch produced no changes" }
          git commit -m "feat: validate Editor renders before promotion"
          git push origin HEAD:editor-all-in-one
