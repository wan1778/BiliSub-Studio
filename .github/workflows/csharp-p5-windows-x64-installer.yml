name: Normalize Caption wording

on:
  pull_request:
    paths:
      - ".github/workflows/csharp-p5-windows-x64-installer.yml"

permissions:
  contents: write

jobs:
  normalize-caption:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace user-facing Karaoke wording with Caption
        env:
          TARGET_BRANCH: editor-all-in-one
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $env:TARGET_BRANCH --depth=100
          git checkout -B caption-normalize "origin/$env:TARGET_BRANCH"

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $text = [IO.File]::ReadAllText($Path)
            if (-not $text.Contains($Old, [StringComparison]::Ordinal)) { throw "Missing expected text in $Path`: $Old" }
            $text = $text.Replace($Old, $New, [StringComparison]::Ordinal)
            [IO.File]::WriteAllText($Path, $text, [Text.UTF8Encoding]::new($false))
          }

          Replace-Exact "csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml" 'Content="Lưu ASS karaoke"' 'Content="Lưu Caption ASS"'
          Replace-Exact "csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml" 'Header="Karaoke theo word timing"' 'Header="Caption theo từng từ (Whisper)"'
          Replace-Exact "csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml.cs" 'Cần Vietsub đầy đủ và Whisper word timing trước khi lưu ASS karaoke.' 'Cần Vietsub đầy đủ và Whisper word timing trước khi lưu Caption ASS.'
          Replace-Exact "csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml.cs" 'Đã lưu ASS karaoke: ' 'Đã lưu Caption ASS: '
          Replace-Exact "csharp/src/BiliSubStudio.Core/Application/BiliSubApplication.cs" 'Chưa có Whisper word timing để tạo ASS karaoke.' 'Chưa có Whisper word timing để tạo Caption ASS.'
          Replace-Exact "csharp/src/BiliSubStudio.Core/Application/BiliSubApplication.cs" 'sourceName + ".karaoke.ass"' 'sourceName + ".caption.ass"'
          Replace-Exact "csharp/src/BiliSubStudio.Core/Application/BiliSubApplication.cs" '"BiliSub.karaoke.ass"' '"BiliSub.caption.ass"'

          git diff --check
          git add csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml.cs csharp/src/BiliSubStudio.Core/Application/BiliSubApplication.cs
          git commit -m "ui: call word-timed subtitles Caption"
          git push origin HEAD:$env:TARGET_BRANCH
