name: Fix beta.33 ASR compile

on:
  pull_request:
    paths:
      - ".github/workflows/csharp-p5-windows-x64-installer.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rename shadowed ASR word probability variable
        env:
          TARGET_BRANCH: editor-all-in-one
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $env:TARGET_BRANCH --depth=100
          git checkout -B fix-asr "origin/$env:TARGET_BRANCH"
          $path = "csharp/src/BiliSubStudio.Core/Editor/LocalAsrService.cs"
          $text = [IO.File]::ReadAllText($path)
          $old1 = 'var probability = GetDouble(word, "probability");'
          $new1 = 'var wordProbability = GetDouble(word, "probability");'
          $old2 = 'double.IsFinite(probability) ? Math.Clamp(probability, 0, 1) : 0));'
          $new2 = 'double.IsFinite(wordProbability) ? Math.Clamp(wordProbability, 0, 1) : 0));'
          if (-not $text.Contains($old1, [StringComparison]::Ordinal)) { throw "Expected declaration not found" }
          if (-not $text.Contains($old2, [StringComparison]::Ordinal)) { throw "Expected word probability use not found" }
          $text = $text.Replace($old1, $new1, [StringComparison]::Ordinal).Replace($old2, $new2, [StringComparison]::Ordinal)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
          git add $path
          git commit -m "fix: avoid ASR probability shadowing"
          git push origin HEAD:$env:TARGET_BRANCH
