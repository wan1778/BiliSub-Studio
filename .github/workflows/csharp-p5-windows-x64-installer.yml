name: Apply M5 render validation checkpoint

on:
  pull_request:
    paths:
      - ".github/workflows/csharp-p5-windows-x64-installer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-all-in-one
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"
      - name: Apply exact M5 source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python .github/m5_apply.py
          if ($LASTEXITCODE -ne 0) { throw "M5 patch script failed" }
          python csharp/scripts/generate_csharp_code_map.py
          if ($LASTEXITCODE -ne 0) { throw "C# code map generation failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "M5 patch introduced whitespace errors" }
          if (-not (Test-Path "docs/migration/CSHARP_EDITOR_M5_CALL_MAP.md" -PathType Leaf)) { throw "M5 call map missing" }
          if ((Get-Content "csharp/Directory.Build.props" -Raw) -notmatch '4\.0\.0-beta\.34-csharp-p5') { throw "beta.34 version missing" }
      - name: Compile and run 50 Core contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = dotnet run --project csharp/tests/BiliSubStudio.Core.ContractTests/BiliSubStudio.Core.ContractTests.csproj -c Release -p:NuGetAudit=false 2>&1 | Tee-Object -Variable lines
          if ($LASTEXITCODE -ne 0) { throw "Core contract runner failed" }
          if (($lines -join "`n") -notmatch '50/50 contract tests passed') { throw "M5 render contract was not executed; expected 50/50" }
      - name: Commit production checkpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/m5_apply.py
          git add csharp/src/BiliSubStudio.Core/Editor/VideoEditorService.cs csharp/tests/BiliSubStudio.Core.ContractTests/Program.cs csharp/Directory.Build.props docs/migration/CSHARP_EDITOR_M5_CALL_MAP.md docs/migration/CSHARP_CODE_MAP.generated.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "staged M5 diff failed check" }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "M5 patch produced no staged changes" }
          git commit -m "feat: validate Editor renders before promotion"
          if ($LASTEXITCODE -ne 0) { throw "M5 commit failed" }
          git push origin HEAD:editor-all-in-one
          if ($LASTEXITCODE -ne 0) { throw "M5 production push failed" }
