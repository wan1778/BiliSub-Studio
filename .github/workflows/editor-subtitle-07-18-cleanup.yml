name: Editor SUB-07 through SUB-18 completion

on:
  push:
    branches:
      - editor-subtitle-07-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-subtitle-07-18
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply SUB-07 through SUB-18
        run: python csharp/scripts/editor_subtitle_07_18_cleanup.py
      - name: Regenerate C# code map
        run: python csharp/scripts/generate_csharp_code_map.py
      - name: Validate static migration contracts
        run: python csharp/scripts/validate_csharp_migration.py
      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csharp/src/BiliSubStudio.App/Pages/EditorPage.xaml.cs \
                  csharp/src/BiliSubStudio.App/Pages/EditorPage.SubtitleCueEditing.cs \
                  csharp/scripts/validate_csharp_migration.py \
                  csharp/tests/BiliSubStudio.Core.ContractTests/EditorSubtitleManualContract.cs \
                  docs/migration/CSHARP_CODE_MAP.generated.md
          git commit -m "editor: complete SUB-07 through SUB-18"
          git push origin HEAD:editor-subtitle-07-18
